<!doctype html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIZZAK API — Swagger UI</title>
  <link rel="stylesheet" href="assets/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .notice { direction: rtl; font-family: system-ui, sans-serif; padding: 10px 16px; background: #0f172a; color: #e2e8f0; }
    .notice a { color: #7dd3fc; margin-inline-start: 12px; }
    #status { direction: rtl; font-family: system-ui, sans-serif; margin: 32px auto; max-width: 760px; padding: 18px 22px; border: 1px solid #cbd5e1; border-radius: 10px; color: #334155; background: #f8fafc; }
    #status.error { border-color: #fca5a5; color: #991b1b; background: #fef2f2; }
  </style>
</head>
<body>
  <div class="notice">
    واجهة AIZZAK API التفاعلية
    <a href="index.html">ReDoc</a>
    <a href="openapi.yaml" download>تنزيل OpenAPI</a>
  </div>
  <div id="status">جارٍ تحميل Swagger UI المحلي…</div>
  <div id="swagger-ui"></div>
  <script src="openapi.js"></script>
  <script src="assets/swagger-ui-bundle.js"></script>
  <script>
    (function () {
      var status = document.getElementById("status");
      function fail(message) {
        status.className = "error";
        status.textContent = "تعذر عرض التوثيق: " + message;
      }
      window.addEventListener("error", function (event) {
        fail(event.message || "حدث خطأ غير معروف.");
      });
      try {
        if (!window.AIZZAK_OPENAPI) throw new Error("لم يتم تحميل عقد OpenAPI المحلي.");
        if (!window.SwaggerUIBundle) throw new Error("لم يتم تحميل مكتبة Swagger المحلية.");
        window.SwaggerUIBundle({
          spec: window.AIZZAK_OPENAPI,
          dom_id: "#swagger-ui",
          deepLinking: true,
          persistAuthorization: false,
          displayRequestDuration: true,
          filter: true,
          tryItOutEnabled: false,
          onComplete: function () { status.remove(); }
        });
      } catch (error) {
        fail(error.message || String(error));
      }
    }());
  </script>
</body>
</html>
